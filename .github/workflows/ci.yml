# Verifies every pull request and every push to main. No deployment: this workflow has no
# secrets, no cloud or Railway credentials, and only read access to the repository.
# Every credential the tests use is generated during the run (random, test-only).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build, secret scan
    # Standard GitHub-hosted runner: free for public repositories (never a larger runner).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json # engines.node (22.x)
          cache: npm
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Secret scan (credential-shaped strings in the repository)
        run: bash e2e/repo-secret-scan.sh
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  integration:
    name: Postgres 18 migrations and end-to-end suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway service container for this job only.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PG_BASE: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Production build (the suite runs `next start`)
        run: npm run build
      - name: Migrations, idempotency, and the end-to-end suite
        # Each step of e2e/ci.sh is reported; any failure fails this check.
        run: bash e2e/ci.sh
        timeout-minutes: 35
        env:
          # psql/pg_dump run inside the service container (its client matches the server).
          # The job context is only available at step level.
          E2E_PG_EXEC: docker exec -i ${{ job.services.postgres.id }}
